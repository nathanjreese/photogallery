name: IndyCar secrets
run-name: IndyCar Driver App 🚀
on: [push]
permissions:
  contents: write
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v3

      - name: Download pictures from Google Drive 📂
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip
          pip install gdown
          gdown --folder https://drive.google.com/drive/folders/${{ secrets.GDRIVE_FOLDER_ID }}?usp=sharing -O ./src/Photos
        env:
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}

      - name: Install dependencies
        run: npm ci

      - name: Build 🔧
        run: npm run build -- --mode production

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: docs
          branch: main

      - name: Serve Locally (Optional)
        run: npx serve docs
