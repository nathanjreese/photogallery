name: IndyCar secrets
run-name: IndyCar Driver App 🚀
on: [push]
permissions:
  contents: write
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v3

      - name: Cache node modules
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Download pictures from Google Drive 📂
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip
          pip install gdown
          
          # Download 2024 photos
          echo "Downloading 2024 photos..."
          gdown --folder https://drive.google.com/drive/folders/${{ secrets.GDRIVE_FOLDER_ID_2024 }}?usp=sharing --remaining-ok -O ./src/Photos || true
          
          echo "Waiting 30 seconds before next download..."
          sleep 30
          
          # Download 2025 photos
          echo "Downloading 2025 photos..."
          gdown --folder https://drive.google.com/drive/folders/${{ secrets.GDRIVE_FOLDER_ID_2025 }}?usp=sharing --remaining-ok -O ./src/Photos || true
          
          echo "Waiting 30 seconds before next download..."
          sleep 30
          
          # Download 2026 photos
          echo "Downloading 2026 photos..."
          gdown --folder https://drive.google.com/drive/folders/${{ secrets.GDRIVE_FOLDER_ID_2026 }}?usp=sharing --remaining-ok -O ./src/Photos || true
          
          # Find and extract all zip files (search recursively)
          echo "Looking for zip files..."
          find ./src/Photos -name "*.zip" -print0 | while IFS= read -r -d '' file; do
            echo "Extracting: $file"
            unzip -qo "$file" -d ./src/Photos
            rm -f "$file"
          done
          find ./src/Photos -name "__MACOSX" -exec rm -rf {} +
        env:
          GDRIVE_FOLDER_ID_2024: ${{ secrets.GDRIVE_FOLDER_ID_2024 }}
          GDRIVE_FOLDER_ID_2025: ${{ secrets.GDRIVE_FOLDER_ID_2025 }}
          GDRIVE_FOLDER_ID_2026: ${{ secrets.GDRIVE_FOLDER_ID_2026 }}

      - name: Build 🔧
        run: npm run build -- --mode production

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
