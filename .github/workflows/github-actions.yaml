name: IndyCar secrets
run-name: IndyCar Driver App 🚀
on: [push]
permissions:
  contents: write
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v3

      - name: Cache node modules
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Download pictures from Google Drive 📂
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip
          pip install gdown
          
          # Retry loop with exponential backoff
          max_attempts=3
          attempt=1
          while [ $attempt -le $max_attempts ]; do
            echo "Download attempt $attempt of $max_attempts"
            if gdown --folder https://drive.google.com/drive/folders/${{ secrets.GDRIVE_FOLDER_ID }}?usp=sharing --remaining-ok -O ./src/Photos; then
              echo "Download successful"
              break
            else
              if [ $attempt -lt $max_attempts ]; then
                delay=$((60 * attempt))
                echo "Download failed, waiting ${delay} seconds before retry..."
                sleep $delay
              fi
            fi
            attempt=$((attempt + 1))
          done
          
          for file in ./src/Photos/*2026*.zip; do
            unzip -qo "$file" -d ./src/Photos
            rm -f "$file"
          done
          find ./src/Photos -name "__MACOSX" -exec rm -rf {} +
        env:
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}

      - name: Build 🔧
        run: npm run build -- --mode production

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
